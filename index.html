<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b2e5f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%236b2e5f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%236b2e5f' stroke-width='2' opacity='.55'/%3E%3C/svg%3E"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script></head><body>
<title>צלחת</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column (max 760px). Phones: a slim brand bar on top, the five views docked as a tab bar at the bottom,
   and a round add button above it. Each day opens with one deep-eggplant hero (calorie ring + protein); everything else
   sits on white cards with quiet borders. Eggplant is the identity colour; blue / orange / aqua belong to the data only. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --surface-2: #eaf0ec; --surface-3: #dfe8e3;
  --ink: #111c18; --ink-2: #3c4a44; --muted: #566360; --line: #d9e1dc; --line-strong: #bfcac4;
  --grid: #e5ebe7; --axis: #bcc6c0;
  --accent: #6b2e5f; --accent-hover: #56224c; --accent-soft: #f4e8f1; --accent-ink: #5f2855; --on-accent: #ffffff;
  --hero: #3b1736; --hero-ink: #ffffff; --hero-muted: #e9d9e5; --hero-line: rgba(255, 255, 255, 0.18);
  --hero-track: rgba(255, 255, 255, 0.15); --hero-ring: #f6b9de; --hero-over: #ffb2a6; --hero-protein: #9cc8ff; --hero-chip: rgba(255, 255, 255, 0.1);
  --protein: #2a78d6; --carb: #eb6834; --fat: #1baf7a; --steps: #6250d6;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #774b00; --bad: #d03b3b; --bad-ink: #b02121;
  --scrim: rgba(12, 20, 17, 0.5); --on-series: #ffffff;
  --shadow: 0 1px 2px rgba(17, 28, 24, 0.05), 0 2px 10px rgba(17, 28, 24, 0.04);
  --shadow-lift: 0 8px 24px rgba(59, 23, 54, 0.28);
  --f-display: "Rubik", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Hebrew", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --fs-xs: 12.5px; --fs-s: 14px; --fs-m: 16px; --fs-l: 18px; --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 40px;
  --r: 16px; --r-s: 12px; --tabbar-h: 0px;
  --meter: color-mix(in srgb, var(--accent) 45%, var(--surface-2));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #151d1a; --surface-2: #1c2622; --surface-3: #24302b;
    --ink: #edf2ef; --ink-2: #c3cdc8; --muted: #9aa7a1; --line: #2a3530; --line-strong: #3a4842;
    --grid: #222c28; --axis: #3d4a44;
    --accent: #dca0cc; --accent-hover: #e9bbdc; --accent-soft: #2f2030; --accent-ink: #ebc0df; --on-accent: #22101d;
    --hero: #2f1a2c; --hero-ink: #fbf3f8; --hero-muted: #dcc6d6; --hero-line: rgba(255, 255, 255, 0.14);
    --hero-track: rgba(255, 255, 255, 0.12); --hero-ring: #f2a9d6; --hero-over: #ffa596; --hero-protein: #8cbcff; --hero-chip: rgba(255, 255, 255, 0.08);
    --protein: #3987e5; --carb: #d95926; --fat: #199e70; --steps: #9085e9;
    --good: #0ca30c; --good-ink: #4cc84c; --warn: #fab219; --warn-ink: #f6c453; --bad: #e66767; --bad-ink: #f39a9a;
    --scrim: rgba(0, 0, 0, 0.62); --shadow: 0 1px 2px rgba(0, 0, 0, 0.45); --shadow-lift: 0 8px 24px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --surface-2: #1c2622; --surface-3: #24302b;
  --ink: #edf2ef; --ink-2: #c3cdc8; --muted: #9aa7a1; --line: #2a3530; --line-strong: #3a4842;
  --grid: #222c28; --axis: #3d4a44;
  --accent: #dca0cc; --accent-hover: #e9bbdc; --accent-soft: #2f2030; --accent-ink: #ebc0df; --on-accent: #22101d;
  --hero: #2f1a2c; --hero-ink: #fbf3f8; --hero-muted: #dcc6d6; --hero-line: rgba(255, 255, 255, 0.14);
  --hero-track: rgba(255, 255, 255, 0.12); --hero-ring: #f2a9d6; --hero-over: #ffa596; --hero-protein: #8cbcff; --hero-chip: rgba(255, 255, 255, 0.08);
  --protein: #3987e5; --carb: #d95926; --fat: #199e70; --steps: #9085e9;
  --good: #0ca30c; --good-ink: #4cc84c; --warn: #fab219; --warn-ink: #f6c453; --bad: #e66767; --bad-ink: #f39a9a;
  --scrim: rgba(0, 0, 0, 0.62); --shadow: 0 1px 2px rgba(0, 0, 0, 0.45); --shadow-lift: 0 8px 24px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

/* Base */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--fs-m); line-height: 1.55; -webkit-font-smoothing: antialiased; }
#app { min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
h1 { font-size: var(--fs-2xl); }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: -4px; }
.skip { position: fixed; z-index: 50; top: calc(8px + env(safe-area-inset-top, 0px)); inset-inline-start: 8px; background: var(--ink); color: var(--bg);
  padding: 10px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; transform: translateY(-200%); }
.skip:focus { transform: none; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.top-inner, .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { display: flex; align-items: center; gap: 12px; min-height: 60px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--accent-ink); letter-spacing: -0.01em; text-decoration: none; border-radius: 10px; }
.brand svg { width: 30px; height: 30px; color: var(--accent); }
.tabs { display: flex; gap: 2px; margin-inline-start: auto; background: var(--surface-2); padding: 4px; border-radius: 14px; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink-2); padding: 8px 12px; min-height: 40px; border-radius: 10px; font-weight: 500; font-size: var(--fs-s); }
.tabs a svg { width: 18px; height: 18px; }
.tabs a:hover { color: var(--ink); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow); font-weight: 600; }
.user-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 4px 12px 4px 4px; min-height: 40px; font-size: var(--fs-s); color: var(--ink-2); min-width: 0; max-width: 220px; }
.user-btn:hover { background: var(--surface-2); }
.user-btn .nm { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.user-btn .out { color: var(--accent-ink); white-space: nowrap; font-weight: 500; }

@media (min-width: 720px) and (max-width: 900px) { .user-btn .nm { display: none; } .tabs a { padding-inline: 10px; } }
/* Phones: the views become a tab bar docked at the bottom */
@media (max-width: 719px) {
  :root { --tabbar-h: 66px; }
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface); }   /* a backdrop filter would trap the fixed tab bar inside the header */
  .top-inner { min-height: 56px; }
  .user-btn { margin-inline-start: auto; }
  .tabs { position: fixed; inset: auto 0 0 0; z-index: 9; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; margin: 0; border-radius: 0;
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(17, 28, 24, 0.06);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabs a { flex-direction: column; justify-content: center; gap: 2px; min-height: 54px; padding: 4px 2px; font-size: 12px; color: var(--muted); border-radius: 12px; }
  .tabs a svg { width: 24px; height: 24px; padding: 3px 16px; box-sizing: content-box; border-radius: 999px; }
  .tabs a:hover { background: none; }
  .tabs a[aria-current="page"] { background: none; box-shadow: none; color: var(--accent-ink); }
  .tabs a[aria-current="page"] svg { background: var(--accent-soft); }
  main.wrap { padding-bottom: calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom, 0px)) !important; }
}

/* Page */
main.wrap { padding-block: 20px 56px; display: grid; gap: 14px; }
main.wrap:focus { outline: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.card h2 { font-size: var(--fs-xl); }
.card h3 { font-size: var(--fs-l); }
.muted { color: var(--muted); }
.small { font-size: var(--fs-s); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: grid; gap: 14px; }
.notice { border-radius: var(--r-s); padding: 12px 14px; background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-s); }
.notice.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--ink); }
.notice.bad { background: color-mix(in srgb, var(--bad) 13%, var(--surface)); color: var(--ink); }
.loading { text-align: center; padding: 64px 0; color: var(--muted); }
.foot { font-size: var(--fs-xs); color: var(--muted); text-align: center; margin: 4px 0 0; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: var(--r-s); padding: 9px 16px; min-height: 44px; font-weight: 500; text-decoration: none; color: var(--ink);
  transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: 0 1px 2px rgba(59, 23, 54, 0.25); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-ink); padding-inline: 10px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.add { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); padding-inline: 12px; font-weight: 600; }
.btn.add:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad-ink); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.big { padding: 13px 20px; font-size: var(--fs-m); width: 100%; min-height: 50px; }
.btn.small { min-height: 36px; padding: 6px 10px; font-size: var(--fs-s); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 18px; line-height: 1; color: var(--ink-2); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn.sm { width: 40px; height: 40px; border-color: transparent; background: transparent; }
.icon-btn.sm:hover { background: var(--surface-2); }
.icon-btn.sm.del:hover { color: var(--bad-ink); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.fab { position: fixed; z-index: 8; inset-inline-end: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 20px; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-lift); display: grid; place-items: center; }
.fab svg { width: 28px; height: 28px; }
.fab:hover { background: var(--accent-hover); }
@media (min-width: 720px) { .fab { display: none !important; } }

/* Date bar */
.datebar { display: flex; align-items: center; gap: 10px; }
.datebar .label { flex: 1; text-align: center; min-width: 0; }
.datebar .label strong { font-family: var(--f-display); font-weight: 600; font-size: var(--fs-xl); display: block; }
.datebar input[type="date"] { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 40px; background: var(--surface); font-size: var(--fs-s); color: var(--ink-2); }

/* Today hero */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 20px; display: grid; gap: 16px; box-shadow: var(--shadow-lift); }
.hero .lbl { color: var(--hero-muted); font-size: var(--fs-s); }
.hero :focus-visible { outline-color: #ffffff; }
.hero-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.ring { width: 148px; height: 148px; display: block; }
.ring .track { fill: none; stroke: var(--hero-track); stroke-width: 12; }
.ring .prog { fill: none; stroke: var(--hero-ring); stroke-width: 12; stroke-linecap: round; }
.ring .prog.over { stroke: var(--hero-over); }
.ring .r-big { font-family: var(--f-display); font-weight: 600; font-size: 32px; fill: var(--hero-ink); }
.ring .r-lbl { font-family: var(--f-body); font-size: 13px; fill: var(--hero-muted); }
.hero-stats { display: grid; gap: 0; }
.hs-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-block: 9px; border-bottom: 1px solid var(--hero-line); }
.hs-row:first-child { padding-top: 0; }
.hs-row:last-child { border-bottom: 0; padding-bottom: 0; }
.hs-row b { font-family: var(--f-display); font-weight: 600; font-size: var(--fs-xl); }
.hs-row b small { font-family: var(--f-body); font-weight: 400; font-size: var(--fs-s); color: var(--hero-muted); }
.hero-prot { display: grid; gap: 8px; }
.hero-prot .top-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hero-bar { height: 10px; border-radius: 999px; background: var(--hero-track); overflow: hidden; position: relative; }
.hero-bar > span { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 999px; background: var(--hero-protein); }
.hero-macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mpill { display: grid; gap: 2px; background: var(--hero-chip); border-radius: 14px; padding: 9px 12px; font-size: var(--fs-s); }
.mpill .mp-n { display: flex; align-items: center; gap: 6px; color: var(--hero-muted); }
.mpill i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.mpill b { font-family: var(--f-display); font-weight: 600; font-size: var(--fs-l); }
@media (max-width: 440px) { .mpill { padding: 8px 10px; } .mpill b { font-size: var(--fs-m); } }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .btn { background: transparent; color: var(--hero-ink); border-color: var(--hero-line); }
.hero .btn:hover { background: var(--hero-chip); }
.hero .chip.good { background: rgba(120, 220, 120, 0.18); color: #c8f5c8; }
@media (max-width: 440px) {
  .hero { padding: 18px 14px; }
  .hero-grid { grid-template-columns: 1fr; justify-items: center; gap: 14px; }
  .hero-stats { width: 100%; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .hs-row { flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; padding: 0 4px !important; border-bottom: 0; border-inline-start: 1px solid var(--hero-line); text-align: center; }
  .hs-row:first-child { border-inline-start: 0; }
  .hs-row .lbl { font-size: 13px; }
  .hs-row b { font-size: var(--fs-l); white-space: nowrap; }
}

/* Meters, macro split, minis */
.kcal-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.kcal-head .big { font-family: var(--f-display); font-size: var(--fs-3xl); line-height: 1; }
.meter { display: grid; gap: 6px; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: var(--fs-s); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > span { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 999px; background: var(--accent); }
.bar.thin { height: 6px; }
.bar > span.over { background: var(--bad); }
.split { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface); }
.split > span { display: block; height: 100%; min-width: 2px; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: var(--fs-s); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 18px; }
.mini { display: grid; gap: 5px; font-size: var(--fs-s); }
.mini .meter-top { font-size: var(--fs-s); }

/* Chips & insights */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good-ink); }
.chip.warn { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--warn-ink); }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad-ink); }
.chip.info { background: var(--surface-2); color: var(--ink-2); }
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.insights li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
.insights .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.ic.good { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good-ink); }
.ic.warn { background: color-mix(in srgb, var(--warn) 25%, var(--surface)); color: var(--warn-ink); }
.ic.bad { background: color-mix(in srgb, var(--bad) 15%, var(--surface)); color: var(--bad-ink); }
.ic.info { background: var(--accent-soft); color: var(--accent-ink); }
.insights b { font-weight: 600; }

/* Meals */
.meal-head { display: flex; align-items: center; gap: 12px; }
.meal-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); flex: none; }
.meal-ic svg { width: 22px; height: 22px; }
.meal-head .ttl { flex: 1; min-width: 0; display: grid; }
.meal-head h3 { flex: 1; }
.meal-head .tot { color: var(--muted); font-size: var(--fs-s); }
.entries { list-style: none; margin: 10px 0 0; padding: 0; }
.entries li { border-top: 1px solid var(--line); }
.entry { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: start; background: none; border: 0; padding: 11px 6px; border-radius: 10px; }
.entry:hover { background: var(--surface-2); }
.entry .n { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
