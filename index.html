<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b2e5f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%236b2e5f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%236b2e5f' stroke-width='2' opacity='.55'/%3E%3C/svg%3E"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>צלחת</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one narrow column, a sticky header with the four views as tabs, a bottom sheet for adding food. */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --surface-2: #edf1ef; --ink: #13201b; --ink-2: #4b5a54; --muted: #6f7c77;
  --line: #dde4e0; --grid: #e6ebe8; --axis: #c3cbc7;
  --accent: #6b2e5f; --accent-hover: #57234d; --accent-soft: #f4e9f1; --on-accent: #ffffff;
  --protein: #2a78d6; --carb: #eb6834; --fat: #1baf7a;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #855400; --bad: #d03b3b; --bad-ink: #b42323;
  --scrim: rgba(12, 20, 17, 0.45);
  --shadow: 0 1px 2px rgba(19, 32, 27, 0.06), 0 6px 20px rgba(19, 32, 27, 0.06);
  --f-display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Hebrew", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1e2824; --ink: #eef2f0; --ink-2: #b9c5c0; --muted: #8c9994;
    --line: #2a352f; --grid: #232d29; --axis: #3a4641;
    --accent: #d89bc8; --accent-hover: #e6b6d9; --accent-soft: #2d2029; --on-accent: #1d1019;
    --protein: #3987e5; --carb: #d95926; --fat: #199e70;
    --good: #0ca30c; --good-ink: #46c246; --warn: #fab219; --warn-ink: #f5c04d; --bad: #e66767; --bad-ink: #f29191;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1e2824; --ink: #eef2f0; --ink-2: #b9c5c0; --muted: #8c9994;
  --line: #2a352f; --grid: #232d29; --axis: #3a4641;
  --accent: #d89bc8; --accent-hover: #e6b6d9; --accent-soft: #2d2029; --on-accent: #1d1019;
  --protein: #3987e5; --carb: #d95926; --fat: #199e70;
  --good: #0ca30c; --good-ink: #46c246; --warn: #fab219; --warn-ink: #f5c04d; --bad: #e66767; --bad-ink: #f29191;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
#app { min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner, .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 22px; color: var(--accent); }
.brand svg { width: 26px; height: 26px; }
.tabs { display: flex; gap: 4px; margin-inline-start: auto; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs a { text-decoration: none; color: var(--ink-2); padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
@media (max-width: 460px) { .tabs { margin-inline-start: 0; width: 100%; justify-content: space-between; } .tabs a { flex: 1; text-align: center; padding: 6px 4px; } }

main.wrap { padding-block: 18px 48px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2 { font-size: 20px; }
.card h3 { font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: grid; gap: 12px; }
.notice { border-radius: 10px; padding: 10px 12px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.notice.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--ink); }
.notice.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--ink); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad-ink); }
.btn.big { padding: 12px 18px; font-size: 16px; width: 100%; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }

/* Date bar */
.datebar { display: flex; align-items: center; gap: 8px; }
.datebar .label { flex: 1; text-align: center; min-width: 0; }
.datebar .label strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; display: block; }
.datebar input[type="date"] { border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; background: var(--surface); font-size: 13px; color: var(--muted); }

/* Summary */
.kcal-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.kcal-head .big { font-family: var(--f-display); font-size: 40px; line-height: 1; }
.kcal-head .of { color: var(--muted); font-size: 15px; }
.left-pill { margin-inline-start: auto; text-align: end; }
.left-pill .v { font-family: var(--f-display); font-size: 24px; line-height: 1.1; }
.meter { display: grid; gap: 6px; }
.meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > span { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 999px; background: var(--accent); }
.bar.thin { height: 6px; }
.bar > span.over { background: var(--bad); }
.split { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface); }
.split > span { display: block; height: 100%; min-width: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.mini { display: grid; gap: 4px; font-size: 13px; }
.mini .meter-top { font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 15%, var(--surface)); color: var(--good-ink); }
.chip.warn { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--warn-ink); }
.chip.bad { background: color-mix(in srgb, var(--bad) 15%, var(--surface)); color: var(--bad-ink); }
.chip.info { background: var(--surface-2); color: var(--ink-2); }

/* Insights */
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.insights li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.insights .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.ic.good { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good-ink); }
.ic.warn { background: color-mix(in srgb, var(--warn) 25%, var(--surface)); color: var(--warn-ink); }
.ic.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad-ink); }
.ic.info { background: var(--surface-2); color: var(--ink-2); }
.insights b { font-weight: 600; }

/* Meals */
.meal-head { display: flex; align-items: center; gap: 8px; }
.meal-head h3 { flex: 1; }
.meal-head .tot { color: var(--muted); font-size: 14px; }
.entries { list-style: none; margin: 8px 0 0; padding: 0; }
.entries li { border-top: 1px solid var(--line); }
.entry { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: start; background: none; border: 0; padding: 10px 2px; border-radius: 8px; }
.entry:hover { background: var(--surface-2); }
.entry .n { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.entry .a { grid-column: 1; color: var(--muted); font-size: 13px; }
.entry .k { grid-row: 1 / span 2; grid-column: 2; text-align: end; font-size: 14px; }
.entry .k small { display: block; color: var(--muted); font-size: 12px; }
.empty-meal { color: var(--muted); font-size: 14px; padding: 6px 0 0; }
.entry-row { display: flex; align-items: center; gap: 6px; }
.entry-row .entry { flex: 1; min-width: 0; }
.entry-actions { display: flex; gap: 4px; flex: none; }
.icon-btn.sm { width: 32px; height: 32px; font-size: 15px; color: var(--ink-2); }
.toast { display: flex; align-items: center; gap: 14px; }
.toast-act { background: none; border: 0; padding: 0; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; align-content: start; }
.tile .t { font-size: 13px; color: var(--muted); }
.tile .v { font-family: var(--f-display); font-size: 28px; line-height: 1.1; }
.tile .s { font-size: 13px; color: var(--ink-2); }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .target { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .target-label { fill: var(--ink-2); font-weight: 600; }
.chart .hit { fill: transparent; }
.chart .bar-k { fill: var(--accent); }
.chart .bar-p { fill: var(--protein); }
.chart .dim { opacity: 0.35; }
.chart .missing { fill: var(--axis); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
.tip b { font-weight: 600; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
.period-nav { display: flex; align-items: center; gap: 8px; }
.period-nav h2 { flex: 1; text-align: center; font-size: 20px; }
.demo-badge { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Forms */
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field input[type="search"], .field select, .qty input {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); width: 100%; min-width: 0;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.choices { display: grid; gap: 8px; }
.choices.inline { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.choice span b { display: block; font-weight: 600; }
.choice span small { color: var(--muted); font-size: 13px; }
.choice input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--bad-ink); font-size: 13px; }
.calc { display: grid; gap: 10px; background: var(--surface-2); border-radius: var(--r); padding: 14px; }
.calc dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0; }
.calc dt { font-size: 12px; color: var(--muted); }
.calc dd { margin: 0; font-weight: 600; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; background: var(--scrim);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-top: env(safe-area-inset-top, 0px); }
.sheet-panel { background: var(--surface); width: 100%; max-width: 600px; max-height: 92vh; display: grid; grid-template-rows: auto 1fr; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 640px) { .sheet { align-items: center; } .sheet-panel { border-radius: 18px; max-height: 86vh; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 19px; }
.sheet-body { overflow-y: auto; padding: 14px 16px 18px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.results { list-style: none; margin: 0; padding: 0; display: grid; }
.results li + li { border-top: 1px solid var(--line); }
.res { width: 100%; text-align: start; background: none; border: 0; padding: 10px 4px; display: grid; gap: 2px; border-radius: 8px; }
.res:hover, .res:focus-visible { background: var(--surface-2); }
.res .n { font-weight: 500; overflow-wrap: anywhere; }
.res .d { font-size: 13px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); margin-inline-end: 6px; }
.tag.mine { background: var(--accent-soft); color: var(--accent); }
.qty { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; }
.qty button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 20px; }
.qty input { text-align: center; font-size: 18px; font-weight: 600; }
.preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 12px 6px; }
.preview .v { font-family: var(--f-display); font-size: 22px; line-height: 1.1; }
.preview .l { font-size: 12px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Users */
.user-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 13px; color: var(--ink-2); min-width: 0; max-width: 220px; }
.user-btn:hover { background: var(--surface-2); }
.user-btn .nm { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.user-btn .out { color: var(--accent); white-space: nowrap; }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--f-display); font-size: 18px; }
.avatar.sm { width: 24px; height: 24px; font-size: 13px; }
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.person { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.person:hover { background: var(--surface-2); }
.person .who { display: grid; min-width: 0; }
.person .who b { font-weight: 600; overflow-wrap: anywhere; }
.person .who small { color: var(--muted); font-size: 13px; }
.person .go { color: var(--muted); font-size: 20px; }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.loading { text-align: center; padding: 48px 0; color: var(--muted); }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width 0.3s ease; } }
</style>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="top-inner">
      <div class="brand" aria-label="צלחת">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/></svg>
        <span>צלחת</span>
      </div>
      <button class="user-btn" id="user-btn" type="button" hidden><span class="avatar sm" id="user-initial" aria-hidden="true"></span><span class="nm" id="user-name"></span><span class="out">יציאה</span></button>
      <nav class="tabs" id="tabs" aria-label="תצוגות" hidden>
        <a href="#today" data-view="today">היום</a>
        <a href="#week" data-view="week">שבוע</a>
        <a href="#month" data-view="month">חודש</a>
        <a href="#profile" data-view="profile">פרופיל</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="view"><div class="loading">טוען את היומן…</div></main>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" id="sheet-close" aria-label="סגירה">×</button></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const KC = 'קק"ל', GR = "ג'", MG = 'מ"ג';
const MEALS = [
  { id: 'b', name: 'ארוחת בוקר' }, { id: 'l', name: 'צהריים' },
  { id: 'd', name: 'ערב' }, { id: 's', name: 'נשנושים' }
];
const MEAL_NAME = Object.fromEntries(MEALS.map(m => [m.id, m.name]));
// [energy multiplier, label, description, protein g/kg for this activity level]
const ACTIVITY = [

function calc(p) {

    return { date, future: date > today, partial: date === today, logged: entries.length > 0, t: totals(entries), meals, entries };

  const srcTxt = { common: 'רשימת המאכלים הנפוצים (מאגר צמרת)', est: 'הערכה (אין פריט מתאים בצמרת)', tz: 'מאגר צמרת, משרד הבריאות', custom: 'מאכל שהוספת' }[f.src] || '';
  const mealSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'ארוחה' }, MEALS.map(m => h('button', { type: 'button', 'aria-pressed': String(sheet.meal === m.id),
    onclick: ev => { sheet.meal = m.id; for (const b of mealSeg.children) b.setAttribute('aria-pressed', String(b === ev.currentTarget)); } }, m.name)));
  const save = () => {
    if (!(sheet.qty > 0)) { toast('צריך כמות גדולה מאפס'); return; }
    const u = unit();
    const entry = { id: sheet.entryId || uid4(), meal: sheet.meal, name: f.name, unit: { l: u.l, g: u.g, kind: u.kind }, qty: Math.round(sheet.qty * 100) / 100,
      g: Math.round(grams() * 10) / 10, v: f.v, src: f.src, code: f.src === 'custom' ? f.id : (f.code || ''), t: Date.now() };
    const day = getDay(sheet.date);
    const entries = editing ? day.entries.map(x => (x.id === entry.id ? entry : x)) : day.entries.concat([entry]);
    setDay(sheet.date, entries); closeSheet(); render(); toast(editing ? 'עודכן' : f.name + ' נוסף');
  };
  body.replaceChildren(
    h('div', null, h('h3', null, f.name), h('div', { class: 'row', style: 'gap:6px' }, h('span', { class: 'muted small' }, srcTxt),
      f.src === 'custom' && !editing && customIndex.some(x => x.id === f.id) ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => openCustomEdit(f.id, true) }, 'עריכת המאכל') : null)),
    h('div', { class: 'field' }, h('label', { for: 'unit' }, 'יחידה'), unitSel),
    h('div', { class: 'field' }, h('label', { for: 'qty' }, 'כמות'),
      h('div', { class: 'qty' },
        h('button', { type: 'button', 'aria-label': 'פחות', onclick: () => { sheet.qty = Math.max(0, Math.round((sheet.qty - stepSize()) * 100) / 100); qtyIn.value = sheet.qty; upd(); } }, '−'),
        qtyIn,
        h('button', { type: 'button', 'aria-label': 'יותר', onclick: () => { sheet.qty = Math.round((sheet.qty + stepSize()) * 100) / 100; qtyIn.value = sheet.qty; upd(); } }, '+')),
      gramsTxt),
    prev,
    h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'ארוחה'), mealSeg),
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', style: 'flex:1', onclick: save }, editing ? 'שמירה' : 'הוספה'),
      editing ? h('button', { class: 'btn danger', onclick: () => { const d = sheet.date, id = sheet.entryId; closeSheet(); removeEntry(d, id); } }, 'הסרה מהיומן')
        : h('button', { class: 'btn', onclick: () => { sheet.step = 'search'; renderSheet(); } }, 'חזרה')));
  upd();
}
function renderCustom(body, title) {
  const editing = sheet.editFoodId ? state.custom.find(x => x.id === sheet.editFoodId) : null;
  const isServ0 = !!(editing && editing.serv);
  // Prefill: stored values are per 100 g; show them per serving when the food was entered that way.
  const pre = i => {
    if (!editing || editing.v[i] == null) return '';
    const val = isServ0 ? editing.v[i] * editing.serv.g / 100 : editing.v[i];
    return String(Math.round(val * 10) / 10);
  };
  title.textContent = editing ? 'עריכת מאכל' : 'מאכל משלך';
  const num = (id, label, req, i) => h('div', { class: 'field' }, h('label', { for: id }, label + (req ? '' : ' (לא חובה)')),
    h('input', { type: 'number', id, inputmode: 'decimal', min: 0, step: 'any', value: pre(i) }));
  const basis = h('div', { class: 'choices inline', role: 'radiogroup' },
    h('label', { class: 'choice' }, h('input', { type: 'radio', name: 'basis', value: '100', checked: !isServ0 }), h('span', null, h('b', null, 'ל-100 גרם'), h('small', null, 'כמו בתווית'))),
    h('label', { class: 'choice' }, h('input', { type: 'radio', name: 'basis', value: 'serv', checked: isServ0 }), h('span', null, h('b', null, 'למנה'), h('small', null, 'יחידה, פרוסה, מנה'))));
  const servBox = h('div', { class: 'grid2', hidden: !isServ0 },
    h('div', { class: 'field' }, h('label', { for: 'cu-sl' }, 'שם המנה'), h('input', { type: 'text', id: 'cu-sl', placeholder: 'למשל: חטיף, פרוסה', maxlength: 30,
      value: isServ0 ? editing.serv.label.replace(/\s*\([^)]*\)\s*$/, '') : '' })),
    h('div', { class: 'field' }, h('label', { for: 'cu-sg' }, 'משקל המנה (' + GR + ')'), h('input', { type: 'number', id: 'cu-sg', inputmode: 'decimal', min: 1, step: 'any',
      value: isServ0 ? String(editing.serv.g) : '' })));
  basis.addEventListener('change', () => { servBox.hidden = basis.querySelector('input:checked').value !== 'serv'; });
  const err = h('div', { class: 'err', role: 'alert' });
  const form = h('form', { class: 'form', novalidate: true },
    h('div', { class: 'field' }, h('label', { for: 'cu-name' }, 'שם המאכל'), h('input', { type: 'text', id: 'cu-name', maxlength: 60, value: editing ? editing.name : sheet.query })),
    h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'הערכים הם'), basis), servBox,
    h('div', { class: 'grid2' }, num('cu-k', 'קלוריות (' + KC + ')', true, 0), num('cu-p', 'חלבון (' + GR + ')', true, 1), num('cu-c', 'פחמימות (' + GR + ')', false, 2),
      num('cu-f', 'שומן (' + GR + ')', false, 4), num('cu-su', 'סוכרים (' + GR + ')', false, 3), num('cu-fi', 'סיבים (' + GR + ')', false, 6), num('cu-na', 'נתרן (' + MG + ')', false, 7)),
    editing ? h('p', { class: 'muted small', style: 'margin:0' }, 'השינוי חל על רישומים מעכשיו. רישומים שכבר נעשו ביומן נשארים כמו שהם.') : null,
    err,
    h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary', style: 'flex:1' }, editing ? 'שמירה' : 'שמירה והמשך'),
      h('button', { type: 'button', class: 'btn', onclick: () => { if (editing) leaveCustomEdit(editing.id); else { sheet.step = 'search'; renderSheet(); } } }, editing ? 'ביטול' : 'חזרה')));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const val = id => { const x = $('#' + id, form).value; return x === '' ? null : +x; };
    const name = $('#cu-name', form).value.trim();
    const isServ = basis.querySelector('input:checked').value === 'serv';
    const sg = val('cu-sg');
    const k = val('cu-k'), pr = val('cu-p');
    if (!name || k == null || pr == null || k < 0 || pr < 0) { err.textContent = 'צריך שם, קלוריות וחלבון.'; return; }
    if (isServ && !(sg > 0)) { err.textContent = 'צריך את משקל המנה בגרמים כדי לחשב.'; return; }
    const factor = isServ ? 100 / sg : 1;
    const v = [k, pr, val('cu-c'), val('cu-su'), val('cu-f'), null, val('cu-fi'), val('cu-na')].map(x => (x == null ? null : Math.round(x * factor * 10) / 10));
    const sl = $('#cu-sl', form).value.trim();
    const food = { id: editing ? editing.id : uid4(), name, v, serv: isServ ? { label: `${sl || 'מנה'} (${fg(sg)} ${GR})`, g: sg } : null };
    if (editing) {
      state.custom = state.custom.map(x => (x.id === food.id ? food : x)); indexCustom(); persist(did('custom'));
      leaveCustomEdit(food.id); toast('המאכל עודכן');
      return;
    }
    state.custom = state.custom.concat([food]); indexCustom(); persist(did('custom'));
    pickFood(customIndex.find(x => x.id === food.id));
  });
  body.replaceChildren(form);
  setTimeout(() => $('#cu-name', form).focus(), 30);
}

/* ---------- start ---------- */
loadFoods().then(() => { if (state.loaded && state.profile && state.view !== 'profile') safeRender(); });
initStore();
})();
