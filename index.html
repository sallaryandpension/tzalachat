<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b2e5f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%236b2e5f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%236b2e5f' stroke-width='2' opacity='.55'/%3E%3C/svg%3E"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script></head><body>
<title>צלחת</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one narrow column, a sticky header with the four views as tabs, a bottom sheet for adding food. */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --surface-2: #edf1ef; --ink: #13201b; --ink-2: #4b5a54; --muted: #6f7c77;
  --line: #dde4e0; --grid: #e6ebe8; --axis: #c3cbc7;
  --accent: #6b2e5f; --accent-hover: #57234d; --accent-soft: #f4e9f1; --on-accent: #ffffff;
  --protein: #2a78d6; --carb: #eb6834; --fat: #1baf7a;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #855400; --bad: #d03b3b; --bad-ink: #b42323;
  --scrim: rgba(12, 20, 17, 0.45); --on-series: #ffffff; --steps: #6250d6;
  --shadow: 0 1px 2px rgba(19, 32, 27, 0.06), 0 6px 20px rgba(19, 32, 27, 0.06);
  --f-display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Hebrew", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1e2824; --ink: #eef2f0; --ink-2: #b9c5c0; --muted: #8c9994;
    --line: #2a352f; --grid: #232d29; --axis: #3a4641;
    --accent: #d89bc8; --accent-hover: #e6b6d9; --accent-soft: #2d2029; --on-accent: #1d1019;
    --protein: #3987e5; --carb: #d95926; --fat: #199e70; --steps: #9085e9;
    --good: #0ca30c; --good-ink: #46c246; --warn: #fab219; --warn-ink: #f5c04d; --bad: #e66767; --bad-ink: #f29191;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1e2824; --ink: #eef2f0; --ink-2: #b9c5c0; --muted: #8c9994;
  --line: #2a352f; --grid: #232d29; --axis: #3a4641;
  --accent: #d89bc8; --accent-hover: #e6b6d9; --accent-soft: #2d2029; --on-accent: #1d1019;
  --protein: #3987e5; --carb: #d95926; --fat: #199e70; --steps: #9085e9;
  --good: #0ca30c; --good-ink: #46c246; --warn: #fab219; --warn-ink: #f5c04d; --bad: #e66767; --bad-ink: #f29191;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
#app { min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner, .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 22px; color: var(--accent); }
.brand svg { width: 26px; height: 26px; }
.tabs { display: flex; gap: 4px; margin-inline-start: auto; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs a { text-decoration: none; color: var(--ink-2); padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
@media (max-width: 460px) { .tabs { margin-inline-start: 0; width: 100%; justify-content: space-between; } .tabs a { flex: 1; text-align: center; padding: 6px 4px; } }

main.wrap { padding-block: 18px 48px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2 { font-size: 20px; }
.card h3 { font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: grid; gap: 12px; }
.notice { border-radius: 10px; padding: 10px 12px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.notice.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--ink); }
.notice.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--ink); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad-ink); }
.btn.big { padding: 12px 18px; font-size: 16px; width: 100%; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }

/* Date bar */
.datebar { display: flex; align-items: center; gap: 8px; }
.datebar .label { flex: 1; text-align: center; min-width: 0; }
.datebar .label strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; display: block; }
.datebar input[type="date"] { border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; background: var(--surface); font-size: 13px; color: var(--muted); }

/* Summary */
.kcal-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.kcal-head .big { font-family: var(--f-display); font-size: 40px; line-height: 1; }
.kcal-head .of { color: var(--muted); font-size: 15px; }
.left-pill { margin-inline-start: auto; text-align: end; }
.left-pill .v { font-family: var(--f-display); font-size: 24px; line-height: 1.1; }
.meter { display: grid; gap: 6px; }
.meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > span { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 999px; background: var(--accent); }
.bar.thin { height: 6px; }
.bar > span.over { background: var(--bad); }
.split { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface); }
.split > span { display: block; height: 100%; min-width: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.mini { display: grid; gap: 4px; font-size: 13px; }
.mini .meter-top { font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 15%, var(--surface)); color: var(--good-ink); }
.chip.warn { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--warn-ink); }
.chip.bad { background: color-mix(in srgb, var(--bad) 15%, var(--surface)); color: var(--bad-ink); }
.chip.info { background: var(--surface-2); color: var(--ink-2); }

/* Insights */
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.insights li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.insights .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.ic.good { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good-ink); }
.ic.warn { background: color-mix(in srgb, var(--warn) 25%, var(--surface)); color: var(--warn-ink); }
.ic.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad-ink); }
.ic.info { background: var(--surface-2); color: var(--ink-2); }
.insights b { font-weight: 600; }

/* Meals */
.meal-head { display: flex; align-items: center; gap: 8px; }
.meal-head h3 { flex: 1; }
.meal-head .tot { color: var(--muted); font-size: 14px; }
.entries { list-style: none; margin: 8px 0 0; padding: 0; }
.entries li { border-top: 1px solid var(--line); }
.entry { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: start; background: none; border: 0; padding: 10px 2px; border-radius: 8px; }
.entry:hover { background: var(--surface-2); }
.entry .n { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.entry .a { grid-column: 1; color: var(--muted); font-size: 13px; }
.entry .k { grid-row: 1 / span 2; grid-column: 2; text-align: end; font-size: 14px; }
.entry .k small { display: block; color: var(--muted); font-size: 12px; }
.empty-meal { color: var(--muted); font-size: 14px; padding: 6px 0 0; }
.entry-row { display: flex; align-items: center; gap: 6px; }
.entry-row .entry { flex: 1; min-width: 0; }
.entry-actions { display: flex; gap: 4px; flex: none; }
.icon-btn.sm { width: 32px; height: 32px; font-size: 15px; color: var(--ink-2); }
.toast { display: flex; align-items: center; gap: 14px; }
.toast-act { background: none; border: 0; padding: 0; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; align-content: start; }
.tile .t { font-size: 13px; color: var(--muted); }
.tile .v { font-family: var(--f-display); font-size: 28px; line-height: 1.1; }
.tile .s { font-size: 13px; color: var(--ink-2); }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .target { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .target-label { fill: var(--ink-2); font-weight: 600; }
.chart .hit { fill: transparent; }
.chart .bar-k { fill: var(--accent); }
.chart .bar-p { fill: var(--protein); }
.chart .bar-s { fill: var(--steps); }
.chart .dim { opacity: 0.35; }
.chart .missing { fill: var(--axis); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
.tip b { font-weight: 600; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
.period-nav { display: flex; align-items: center; gap: 8px; }
.period-nav h2 { flex: 1; text-align: center; font-size: 20px; }
.demo-badge { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Forms */
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field input[type="search"], .field input[type="email"], .field input[type="password"], .field select, .qty input {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); width: 100%; min-width: 0;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.choices { display: grid; gap: 8px; }
.choices.inline { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.choice span b { display: block; font-weight: 600; }
.choice span small { color: var(--muted); font-size: 13px; }
.choice input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--bad-ink); font-size: 13px; }
.calc { display: grid; gap: 10px; background: var(--surface-2); border-radius: var(--r); padding: 14px; }
.calc dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0; }
.calc dt { font-size: 12px; color: var(--muted); }
.calc dd { margin: 0; font-weight: 600; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; background: var(--scrim);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-top: env(safe-area-inset-top, 0px); }
.sheet-panel { background: var(--surface); width: 100%; max-width: 600px; max-height: 92vh; display: grid; grid-template-rows: auto 1fr; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 640px) { .sheet { align-items: center; } .sheet-panel { border-radius: 18px; max-height: 86vh; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 19px; }
.sheet-body { overflow-y: auto; padding: 14px 16px 18px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.results { list-style: none; margin: 0; padding: 0; display: grid; }
.results li + li { border-top: 1px solid var(--line); }
.res { width: 100%; text-align: start; background: none; border: 0; padding: 10px 4px; display: grid; gap: 2px; border-radius: 8px; }
.res:hover, .res:focus-visible { background: var(--surface-2); }
.res .n { font-weight: 500; overflow-wrap: anywhere; }
.res .d { font-size: 13px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); margin-inline-end: 6px; }
.tag.mine { background: var(--accent-soft); color: var(--accent); }
.qty { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; }
.qty button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 20px; }
.qty input { text-align: center; font-size: 18px; font-weight: 600; }
.preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 12px 6px; }
.preview .v { font-family: var(--f-display); font-size: 22px; line-height: 1.1; }
.preview .l { font-size: 12px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Weight */
.wform { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.wform .field { flex: 1 1 140px; }
.wform .btn { flex: 0 0 auto; height: 42px; }
.chart .wline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .warea { fill: var(--accent); opacity: 0.08; }
.chart .wpt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .wpt.on { fill: var(--accent); }
.chart .wlast { fill: var(--ink); font-weight: 600; font-size: 12px; }
.chart .whit { fill: transparent; cursor: crosshair; }
.wlist { max-height: 360px; overflow-y: auto; }
.wlist .entry { cursor: default; }

/* Macro pie (donut) */
.donut-wrap { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 520px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .donut-info { width: 100%; } }
.donut { width: 100%; max-width: 220px; height: auto; display: block; }
.donut .donut-big { font-family: var(--f-display); font-size: 30px; fill: var(--ink); }
.donut .donut-small { font-family: var(--f-body); font-size: 12px; fill: var(--muted); }
.donut .pct { fill: var(--on-series); font-family: var(--f-body); font-size: 12px; font-weight: 700; }
.donut-info { display: grid; gap: 12px; min-width: 0; }
.donut-info .big { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.dl { display: grid; gap: 10px; }
.dl-row { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 8px; align-items: center; }
.dl-row i { width: 12px; height: 12px; border-radius: 3px; }
.dl-row .dl-sub { grid-column: 2 / -1; font-size: 12px; }

/* Users */
.user-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 13px; color: var(--ink-2); min-width: 0; max-width: 220px; }
.user-btn:hover { background: var(--surface-2); }
.user-btn .nm { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.user-btn .out { color: var(--accent); white-space: nowrap; }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--f-display); font-size: 18px; }
.avatar.sm { width: 24px; height: 24px; font-size: 13px; }
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.person { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.person:hover { background: var(--surface-2); }
.person .who { display: grid; min-width: 0; }
.person .who b { font-weight: 600; overflow-wrap: anywhere; }
.person .who small { color: var(--muted); font-size: 13px; }
.person .go { color: var(--muted); font-size: 20px; }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.loading { text-align: center; padding: 48px 0; color: var(--muted); }
.foot { font-size: 12px; color: var(--muted); text-align: center; }

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const KC = 'קק"ל', GR = "ג'", MG = 'מ"ג';
const MEALS = [
  { id: 'b', name: 'ארוחת בוקר' }, { id: 'l', name: 'צהריים' },
  { id: 'd', name: 'ערב' }, { id: 's', name: 'נשנושים' }
];
const MEAL_NAME = Object.fromEntries(MEALS.map(m => [m.id, m.name]));
// [energy multiplier, label, description, protein g/kg for this activity level]
const ACTIVITY = [
  [1.2, 'יושבני', 'עבודה משרדית, כמעט בלי פעילות גופנית', 1.0],
  [1.375, 'פעיל', '1–3 אימונים בשבוע, או הרבה הליכה', 1.4],
  [1.55, 'פעיל מאוד', '3–5 אימונים בשבוע', 1.6],
  [1.725, 'ספורטיבי', '6–7 אימונים בשבוע', 1.8],
  [1.9, 'אינטנסיבי', 'עבודה פיזית ואימונים כמעט כל יום', 2.0]
];
const GOALS = [
  ['lose', 'ירידה במשקל', 'כחצי ק"ג בשבוע', -500],
  ['lose_slow', 'ירידה מתונה', 'כרבע ק"ג בשבוע', -250],
  ['maintain', 'שמירה על המשקל', 'בלי גירעון או עודף', 0],
  ['gain', 'עלייה במשקל / בניית שריר', 'עודף קטן של כ-300 ' + KC, 300]
];
// Extra protein for the goal: more in a deficit (keeps muscle) and when building muscle.
const PROTEIN_GOAL_ADD = { lose: 0.2, lose_slow: 0.1, maintain: 0, gain: 0.2 };
const PROTEIN_MAX = 2.2, PROFILE_VERSION = 2;
const REC = { sodium: 2000, fiber: 25, satPct: 10 };
const NUTR = ['k', 'p', 'c', 'su', 'f', 'sf', 'fi', 'na'];
const CAT = {
  eggs: 'ביצים', dairy: 'חלב וגבינות', bread: 'לחם ומאפים', spreads: 'ממרחים', salads: 'סלטים',
  cereal: 'דגני בוקר', meat: 'עוף ובשר', fish: 'דגים', sides: 'תוספות', legumes: 'קטניות', soups: 'מרקים',
  home: 'תבשילים', street: 'אוכל רחוב', salty: 'חטיפים', nuts: 'פיצוחים', bars: 'חטיפי דגנים', sweets: 'מתוקים',
  icecream: 'גלידות', fruits: 'פירות', veg: 'ירקות', drinks: 'משקאות', holidays: 'שבת וחגים'
};
const PROTEIN_CATS = new Set(['dairy', 'eggs', 'meat', 'fish', 'legumes', 'spreads']);
// Foods eaten by the spoon: sauces, dips, spreads, oils, cream, sweeteners. Matched on the start of the name.
const SPOON_RE = /^(רוטב|רטב|ממרח|מיונז|קטשופ|חרדל|ויניגרט|פסטו|הריסה|אריסה|סחוג|עמבה|צ'ילי|טחינה|סלט טחינה|סלט חומוס|סלט חצילים|סלט מטבוחה|מטבוחה|סלט איקרא|ציזיקי|צזיקי|מטבל|שמן|חמאה|חמאת|מרגרינה|שמנת|קצפת|לאבנה|לבנה|גבינת שמנת|דבש|סירופ|סילאן|ריבה|ריבת|ממתיק|סוכר|אבקת קקאו|רסק עגבניות|טריאקי|ברביקיו|איולי|זעתר)(?=$|[\s,(\-"'׳])/;
const isSpoonFood = name => SPOON_RE.test(String(name).trim());
// Put tablespoon and teaspoon first; add them (marked approximate) when Tzameret has no weight for them.
function spoonUnits(name, units) {
  const find = n => units.find(u => u[0] === n);
  const tb = find('כף'), ts = find('כפית');
  const tbG = tb ? tb[1] : ts ? Math.round(ts[1] * 3 * 10) / 10 : (/^שמן/.test(name) ? 13.5 : 15);
  const tsG = ts ? ts[1] : Math.round(tbG / 3 * 10) / 10;
  const rest = units.filter(u => u[0] !== 'כף' && u[0] !== 'כפית');
  return [['כף', tbG, !tb], ['כפית', tsG, !ts], ...rest];
}
const DOW = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const LS_KEY = 'tzalachat-v1';
const CUR_KEY = 'tzalachat-current', LOGGED_OUT = '__out__';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const nf0 = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 1 });
const f0 = v => nf0.format(Math.round(v || 0));
const f1 = v => nf1.format(Math.round((v || 0) * 10) / 10);
const fg = v => (v < 10 ? f1(v) : f0(v));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid4 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else if (k in e && typeof v !== 'string') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}

/* dates (local time, never UTC) */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseYmd = str => { const [y, m, d] = str.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (str, n) => { const d = parseYmd(str); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());
const weekStart = str => { const d = parseYmd(str); d.setDate(d.getDate() - d.getDay()); return ymd(d); };
const dfLong = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
const dfDayMonth = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'long' });
const dfShort = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'numeric' });
const dfMonth = new Intl.DateTimeFormat('he-IL', { month: 'long', year: 'numeric' });
function rangeDates(a, b) { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }

/* Hebrew search normalisation: no niqqud, final letters folded, punctuation dropped */
const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
const norm = t => String(t).toLowerCase().replace(/[֑-ׇ]/g, '').replace(/[ךםןףץ]/g, c => FINALS[c])
  .replace(/["'׳״`,.()\-–—\/+&*%:;!?]/g, ' ').replace(/\s+/g, ' ').trim();

let toastTimer = 0;
function toast(msg, actionLabel, action) {
  const t = $('#toast');
  t.replaceChildren(h('span', null, msg));
  if (actionLabel) t.append(h('button', { class: 'toast-act', type: 'button', onclick: () => { t.hidden = true; clearTimeout(toastTimer); action(); } }, actionLabel));
  t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, actionLabel ? 6000 : 2600);
}

/* Install as an app: the browser offers this only on the website (Android Chrome), never inside Claude. */
let installPrompt = null;
const INSTALL_DISMISSED = 'tzalachat-install-dismissed';
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (state.loaded) safeRender(); });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('צלחת הותקנה במכשיר'); if (state.loaded) safeRender(); });
function installButton(label) {
  if (!installPrompt) return null;
  return h('button', { class: 'btn primary', type: 'button', onclick: async () => {
    const p = installPrompt; installPrompt = null;
    try { await p.prompt(); await p.userChoice; } catch (e) {}
    safeRender();
  } }, label || 'התקנה כאפליקציה');
}
function installCard() {
  let dismissed = false; try { dismissed = localStorage.getItem(INSTALL_DISMISSED) === '1'; } catch (e) {}
  if (!installPrompt || dismissed) return null;
  return h('section', { class: 'card row', 'aria-label': 'התקנה' },
    h('span', { style: 'flex:1;min-width:200px' }, h('b', null, 'אפשר להתקין את צלחת כאפליקציה.'), ' היא תופיע במסך הבית, תיפתח בחלון משלה ותעבוד גם בלי אינטרנט.'),
    installButton('התקנה'),
    h('button', { class: 'btn ghost', type: 'button', onclick: () => { try { localStorage.setItem(INSTALL_DISMISSED, '1'); } catch (e) {} render(); } }, 'לא עכשיו'));
}

/* ---------- state ---------- */
const state = {
  mode: 'loading', loaded: false, slow: false, readonly: false, dbError: null,
  all: {}, pid: null, newUser: false,   // every user's data by user id; pid = who is using the app now
  common: [], tz: [], tzLoaded: false, tzLoading: null, foodsError: false, commonCodes: new Set(),
  view: 'today', date: todayStr(), weekOff: 0, monthOff: 0, demo: { week: false, month: false }
};
const blank = () => ({ profile: null, days: {}, custom: [], weights: [] });
// state.profile / state.days / state.custom / state.weights always mean the current user's data.
for (const k of ['profile', 'days', 'custom', 'weights']) Object.defineProperty(state, k, {
  get() {
    if (!state.pid) return k === 'days' ? {} : (k === 'custom' || k === 'weights') ? [] : null;
    const b = state.all[state.pid] || (state.all[state.pid] = blank());
    if (k === 'weights' && !b.weights) b.weights = [];
    return b[k];
  },
  set(v) { if (state.pid) (state.all[state.pid] || (state.all[state.pid] = blank()))[k] = v; }
});

/* ---------- users on this account ---------- */
// The first user keeps the original document names; every later user's documents start with "p-<id>-".
const did = base => (state.pid === 'main' ? '' : 'p-' + state.pid + '-') + base;
function parseDocId(id) {
  let pid = 'main', rest = id;
  const m = /^p-([a-z0-9]+)-(.+)$/.exec(id); if (m) { pid = m[1]; rest = m[2]; }
  if (rest === 'profile') return { pid, kind: 'profile' };
  if (rest === 'custom') return { pid, kind: 'custom' };
  if (rest === 'weights') return { pid, kind: 'weights' };
  if (rest.startsWith('day-')) return { pid, kind: 'day', date: rest.slice(4) };
  return null;
}
function people() {
  return Object.entries(state.all).filter(([, b]) => b && b.profile)
    .map(([id, b]) => ({ id, name: b.profile.name || '', created: b.profile.created || 0, profile: b.profile, days: b.days || {} }))
    .sort((a, b) => a.created - b.created);
}
const displayName = p => p.name || (p.id === 'main' ? 'המשתמש הראשי' : 'ללא שם');
function rememberPid(v) { try { localStorage.setItem(CUR_KEY, v); } catch (e) {} }
function pickInitialPid() {
  let cur = null; try { cur = localStorage.getItem(CUR_KEY); } catch (e) {}
  const ids = people().map(p => p.id);
  if (cur === LOGGED_OUT && ids.length) return null;
  if (cur && ids.includes(cur)) return cur;
  if (ids.length === 1) return ids[0];
  if (!ids.length) return 'main';
  return null;
}
function enterUser(pid) {
  closeSheet();
  Object.assign(state, { pid, newUser: false, date: todayStr(), weekOff: 0, monthOff: 0, demo: { week: false, month: false } });
  indexCustom(); rememberPid(pid);
  if (location.hash !== '#today') location.hash = '#today'; else render();
  window.scrollTo(0, 0);
  setTimeout(migrateProfile, 0);
}
function startNewUser() {
  closeSheet();
  state.pid = people().length ? uid4().replace(/[^a-z0-9]/g, '') : 'main';
  state.all[state.pid] = blank(); state.newUser = true;
  render(); window.scrollTo(0, 0);
}
function logout() {
  closeSheet();
  if (state.pid && state.all[state.pid] && !state.all[state.pid].profile) delete state.all[state.pid];
  state.pid = null; state.newUser = false; rememberPid(LOGGED_OUT);
  render(); window.scrollTo(0, 0);
}

/* ---------- nutrition math ---------- */
function totals(entries) {
  const t = { k: 0, p: 0, c: 0, su: 0, f: 0, sf: 0, fi: 0, na: 0 };
  for (const e of entries) NUTR.forEach((n, i) => { t[n] += (e.v[i] || 0) * e.g / 100; });
  return t;
}
const entryKcal = e => (e.v[0] || 0) * e.g / 100;
const entryProt = e => (e.v[1] || 0) * e.g / 100;

function calc(p) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * p.activity;
  const goal = GOALS.find(g => g[0] === p.goal) || GOALS[2];
  const floor = p.sex === 'm' ? 1500 : 1200;
  let kcal = tdee + goal[3], clamped = false;
  if (kcal < floor) { kcal = floor; clamped = true; }
  kcal = Math.round(kcal / 50) * 50;
  const hm = p.height / 100, bmi = p.weight / (hm * hm);
  let refW = p.weight, adjusted = false;
  if (bmi > 30) { const ideal = 25 * hm * hm; refW = ideal + 0.4 * (p.weight - ideal); adjusted = true; }
  const act = ACTIVITY.find(a => a[0] === p.activity) || ACTIVITY[1];
  const goalAdd = PROTEIN_GOAL_ADD[p.goal] || 0;
  let perKg = Math.min(PROTEIN_MAX, act[3] + goalAdd);
  if (p.age >= 65) perKg = Math.max(perKg, 1.2);
  perKg = Math.round(perKg * 10) / 10;
  const protein = Math.round(refW * perKg / 5) * 5;
  return { bmr, tdee, kcal, clamped, bmi, perKg, actBase: act[3], actLabel: act[1], goalAdd, refW, adjusted, protein };
}
function bmiLabel(b) {
  if (b < 18.5) return 'תת-משקל';
  if (b < 25) return 'תקין';
  if (b < 30) return 'עודף משקל';
  return 'השמנה';
}

/* Profiles saved before the activity-based protein rule get their automatic target recalculated once. */
const migrated = new Set();
function migrateProfile() {
  const p = state.profile;
  if (!p || migrated.has(state.pid) || (p.pv || 1) >= PROFILE_VERSION || state.readonly) return;
  migrated.add(state.pid);
  const next = { ...p, pv: PROFILE_VERSION };
  let msg = '';
  if (!p.proteinManual && p.sex && p.age && p.height && p.weight) {
    const c = calc(p);
    if (c.protein !== p.proteinTarget) { msg = `יעד החלבון עודכן לפי רמת הפעילות: ${f0(c.protein)} ${GR}`; next.proteinTarget = c.protein; }
  }
  state.profile = next; persist(did('profile')); safeRender();
  if (msg) toast(msg);
}

/* ---------- storage: private db subtree in the artifact, or this browser ---------- */
let DB = null, UID = null;
let FS = null, AUTH = null, CLOUD_USER = null, unsubCloud = null, writeEpoch = 0;   // website build only (Firebase)
const writes = {};
async function initStore() {
  if (window.TZ_CLOUD) {
    if (window.firebase) return initCloud();
    state.fatal = 'לא הצלחתי להתחבר לשרת. בדקו את החיבור לאינטרנט ורעננו את הדף.';
    state.loaded = true; render(); return;
  }
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return useLocal();
  try {
    const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
    const id = u ? await u.id() : null;
    if (!d || !id) return useLocal();
    DB = d; UID = id; state.mode = 'db';
    subscribe(DB.collection('data/users/' + UID));
  } catch (e) { useLocal(); }
}
function useLocal() {
  state.mode = 'local';
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o.v === 2) state.all = o.all || {};
      else if (o.profile) state.all = { main: { profile: o.profile, days: o.days || {}, custom: o.custom || [] } };
    }
  } catch (e) { state.localBroken = true; }
  state.loaded = true; state.pid = pickInitialPid(); indexCustom(); route();
  setTimeout(migrateProfile, 0);
}
function saveLocal() {
  const all = {};
  for (const [k, b] of Object.entries(state.all)) if (b && b.profile) all[k] = b;
  try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 2, all })); }
  catch (e) { toast('לא הצלחתי לשמור בדפדפן הזה'); }
}
/* ---------- cloud accounts: the website build signs in with Firebase (email + password) ---------- */
// Each account's documents: users/<uid>/docs/<same document names as above>.
const cloudCol = () => FS.collection('users').doc(CLOUD_USER.uid).collection('docs');
function resetData() {
  writeEpoch++;
  for (const k of Object.keys(writes)) delete writes[k];
  Object.assign(state, { all: {}, pid: null, newUser: false, loaded: false, slow: false, readonly: false, dbError: null });
  migrated.clear(); indexCustom();
}
function initCloud() {
  try {
    firebase.initializeApp(window.TZ_CLOUD);
    AUTH = firebase.auth(); FS = firebase.firestore();
    FS.enablePersistence({ synchronizeTabs: true }).catch(() => {});   // works offline in the installed app
  } catch (e) {
    state.fatal = 'החיבור לשרת נכשל. רעננו את הדף.'; state.loaded = true; render(); return;
  }
  state.mode = 'cloud';
  AUTH.onAuthStateChanged(user => {
    if (unsubCloud) { unsubCloud(); unsubCloud = null; }
    resetData(); closeSheet();
    CLOUD_USER = user;
    if (!user) { state.needLogin = true; state.loaded = true; render(); return; }
    state.needLogin = false; render();
    unsubCloud = subscribe(cloudCol());
  });
}
async function signOutCloud() {
  closeSheet();
  try { await AUTH.signOut(); } catch (e) { toast('ההתנתקות לא הצליחה. נסו שוב.'); }
}
function authError(e) {
  const c = (e && e.code) || '';
  return ({
    'auth/invalid-email': 'המייל לא תקין.',
    'auth/invalid-credential': 'המייל או הסיסמה לא נכונים.',
    'auth/wrong-password': 'המייל או הסיסמה לא נכונים.',
    'auth/user-not-found': 'המייל או הסיסמה לא נכונים.',
    'auth/missing-password': 'צריך סיסמה.',
    'auth/email-already-in-use': 'כבר יש חשבון עם המייל הזה. אפשר להיכנס, או ללחוץ על "שכחתי סיסמה".',
    'auth/weak-password': 'הסיסמה קצרה מדי. צריך לפחות 6 תווים.',
    'auth/too-many-requests': 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.',
    'auth/network-request-failed': 'אין חיבור לאינטרנט. התחברו ונסו שוב.',
    'auth/operation-not-allowed': 'ההרשמה עדיין לא הופעלה באתר.'
  })[c] || 'משהו השתבש. נסו שוב.';
}
/* A diary kept in this browser before accounts existed can move into the account. */
const IMPORTED_KEY = 'tzalachat-imported';
function localBackup() {
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return null;
    const o = JSON.parse(raw);
    const all = o.v === 2 ? (o.all || {}) : (o.profile ? { main: { profile: o.profile, days: o.days || {}, custom: o.custom || [] } } : {});
    return Object.keys(all).some(k => all[k] && all[k].profile) ? all : null;
  } catch (e) { return null; }

function subscribe(col) {
  const timer = setTimeout(() => { if (!state.loaded) { state.slow = true; render(); } }, 10000);
  return col.onSnapshot(snap => {
    if (!state.loaded && snap.metadata.fromCache && snap.empty) return;   // wait for the store before choosing a user
    const all = {};
    for (const d of snap.docs) {
      const data = d.data(), info = parseDocId(d.id); if (!data || !info) continue;
      const b = all[info.pid] || (all[info.pid] = blank());
      if (info.kind === 'profile') b.profile = clone(data);
      else if (info.kind === 'custom') b.custom = clone(data.foods || []);
      else if (info.kind === 'weights') b.weights = clone(data.list || []);
      else b.days[info.date] = clone(data);
    }
    // Keep this device's unsent edits over what the store has.
    for (const [id, w] of Object.entries(writes)) {
      if (!(w.busy || w.dirty)) continue;
      const info = parseDocId(id); if (!info) continue;
      const lb = state.all[info.pid], b = all[info.pid] || (all[info.pid] = blank());
      if (info.kind === 'profile') b.profile = lb ? lb.profile : null;
      else if (info.kind === 'custom') b.custom = lb ? lb.custom : [];
      else if (info.kind === 'weights') b.weights = lb ? (lb.weights || []) : [];
      else if (lb && lb.days[info.date]) b.days[info.date] = lb.days[info.date]; else delete b.days[info.date];
    }
    if (state.pid && state.newUser && !all[state.pid]) all[state.pid] = state.all[state.pid] || blank();
    state.all = all;
    const first = !state.loaded; state.loaded = true;
    if (first) state.pid = pickInitialPid();
    else if (state.pid && !state.newUser && !(all[state.pid] && all[state.pid].profile)) state.pid = null;   // user removed elsewhere
    if (!snap.metadata.fromCache) { clearTimeout(timer); state.slow = false; }
    indexCustom();
    if (first) { route(); if (!snap.metadata.fromCache) setTimeout(migrateProfile, 0); }
    else { safeRender(); if (!snap.metadata.fromCache) setTimeout(migrateProfile, 0); }
  }, err => {
    clearTimeout(timer); state.dbError = err && err.code; state.loaded = true; render();
  });
}
function persist(docId) {

function indexCustom() {

    return { ...f, key: 'u' + f.id, src: 'custom', spoon, units: spoon ? spoonUnits(f.name, []) : [], q: norm(f.name) };

function searchFoods(q) {
  const nq = norm(q); if (!nq) return [];
  const toks = nq.split(' ');
  const out = [];
  const consider = (f, base) => {
    for (const t of toks) if (!f.q.includes(t)) return;
    let sc = base;
    if (f.q.startsWith(toks[0])) sc += 30; else if (f.q.includes(' ' + toks[0])) sc += 15;
    sc -= f.name.length * 0.15;
    out.push([sc, f]);
  };
  customIndex.forEach(f => consider(f, 130));
  state.common.forEach(f => consider(f, 100));
  state.tz.forEach(f => consider(f, 0));
  out.sort((a, b) => b[0] - a[0]);
  return out.slice(0, 60).map(x => x[1]);
}

  const dates = Object.keys(state.days).sort().reverse().slice(0, 45);
  const seen = new Set(), out = [];
  for (const d of dates) for (const e of [...state.days[d].entries].reverse()) {
    const k = e.name + '|' + e.unit.l + '|' + e.qty;
    if (seen.has(k)) continue; seen.add(k); out.push(e);
    if (out.length >= 14) return out;
  }

}
function findFoodFor(entry) {

  } }, opts.map((o, i) => h('option', { value: i, selected: i === sheet.unitIdx }, o.show)));
  const srcTxt = { common: 'רשימת המאכלים הנפוצים (מאגר צמרת)', est: 'הערכה (אין פריט מתאים בצמרת)', tz: 'מאגר צמרת, משרד הבריאות', custom: 'מאכל שהוספת' }[f.src] || '';

    h('div', { class: 'field' }, h('label', { for: 'unit' }, 'יחידה'), unitSel),

function renderCustom(body, title) {
  const editing = sheet.editFoodId ? state.custom.find(x => x.id === sheet.editFoodId) : null;
  const isServ0 = !!(editing && editing.serv);
  // Prefill: stored values are per 100 g; show them per serving when the food was entered that way.
  const pre = i => {
    if (!editing || editing.v[i] == null) return '';
    const val = isServ0 ? editing.v[i] * editing.serv.g / 100 : editing.v[i];
    return String(Math.round(val * 10) / 10);
  };
  title.textContent = editing ? 'עריכת מאכל' : 'מאכל משלך';
  const num = (id, label, req, i) => h('div', { class: 'field' }, h('label', { for: id }, label + (req ? '' : ' (לא חובה)')),
    h('input', { type: 'number', id, inputmode: 'decimal', min: 0, step: 'any', value: pre(i) }));
  const basis = h('div', { class: 'choices inline', role: 'radiogroup' },
    h('label', { class: 'choice' }, h('input', { type: 'radio', name: 'basis', value: '100', checked: !isServ0 }), h('span', null, h('b', null, 'ל-100 גרם'), h('small', null, 'כמו בתווית'))),
    h('label', { class: 'choice' }, h('input', { type: 'radio', name: 'basis', value: 'serv', checked: isServ0 }), h('span', null, h('b', null, 'למנה'), h('small', null, 'יחידה, פרוסה, מנה'))));
  const servBox = h('div', { class: 'grid2', hidden: !isServ0 },
    h('div', { class: 'field' }, h('label', { for: 'cu-sl' }, 'שם המנה'), h('input', { type: 'text', id: 'cu-sl', placeholder: 'למשל: חטיף, פרוסה', maxlength: 30,
      value: isServ0 ? editing.serv.label.replace(/\s*\([^)]*\)\s*$/, '') : '' })),
    h('div', { class: 'field' }, h('label', { for: 'cu-sg' }, 'משקל המנה (' + GR + ')'), h('input', { type: 'number', id: 'cu-sg', inputmode: 'decimal', min: 1, step: 'any',
      value: isServ0 ? String(editing.serv.g) : '' })));
  basis.addEventListener('change', () => { servBox.hidden = basis.querySelector('input:checked').value !== 'serv'; });

    h('div', { class: 'field' }, h('label', { for: 'cu-name' }, 'שם המאכל'), h('input', { type: 'text', id: 'cu-name', maxlength: 60, value: editing ? editing.name : sheet.query })),
    h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'הערכים הם'), basis), servBox,
    h('div', { class: 'grid2' }, num('cu-k', 'קלוריות (' + KC + ')', true, 0), num('cu-p', 'חלבון (' + GR + ')', true, 1), num('cu-c', 'פחמימות (' + GR + ')', false, 2),

    editing ? h('p', { class: 'muted small', style: 'margin:0' }, 'השינוי חל על רישומים מעכשיו. רישומים שכבר נעשו ביומן נשארים כמו שהם.') : null,
    err,
    h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary', style: 'flex:1' }, editing ? 'שמירה' : 'שמירה והמשך'),
      h('button', { type: 'button', class: 'btn', onclick: () => { if (editing) leaveCustomEdit(editing.id); else { sheet.step = 'search'; renderSheet(); } } }, editing ? 'ביטול' : 'חזרה')));
  form.addEventListener('submit', e => {
    e.preventDefault();

    const name = $('#cu-name', form).value.trim();

    const sg = val('cu-sg');
    const k = val('cu-k'), pr = val('cu-p');
    if (!name || k == null || pr == null || k < 0 || pr < 0) { err.textContent = 'צריך שם, קלוריות וחלבון.'; return; }
    if (isServ && !(sg > 0)) { err.textContent = 'צריך את משקל המנה בגרמים כדי לחשב.'; return; }
