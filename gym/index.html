<title>יומן כושר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* layout: one narrow column; sticky workout header on top, the rest timer docked to the bottom edge. Accents borrow the colour code of competition plates (blue 20 kg, red 25 kg). */
:root {
  --bg: #edf0f3; --surface: #ffffff; --ink: #151a20; --muted: #5a6470; --line: #d3d9e0;
  --accent: #1d4ccc; --on-accent: #ffffff; --soft: #e1e8fa;
  --red: #c42d26; --red-soft: #fbe5e3; --green: #1b7a45; --green-soft: #def3e6; --chip: #e6eaee;
  --f-display: "Rubik", "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  --f-body: "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1115; --surface: #171b21; --ink: #e7ebf0; --muted: #98a2ae; --line: #2a3139;
  --accent: #6e94ff; --on-accent: #0b1020; --soft: #1c2640;
  --red: #ff6f63; --red-soft: #3a1b19; --green: #50c482; --green-soft: #15301f; --chip: #222830;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1115; --surface: #171b21; --ink: #e7ebf0; --muted: #98a2ae; --line: #2a313a;
  --accent: #6e94ff; --on-accent: #0b1020; --soft: #1c2640;
  --red: #ff6f63; --red-soft: #3a1b19; --green: #50c482; --green-soft: #15301f; --chip: #222830;
  color-scheme: dark; }

[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 140px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 1.9rem; font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .75rem; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--red); border-color: var(--red); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.big { min-height: 60px; font-size: 1.15rem; border-radius: 14px; width: 100%; }
.btn.icon { padding: 0; width: 44px; min-height: 44px; border-color: transparent; background: transparent; color: var(--muted); }
.btn.icon:hover { background: var(--chip); }
.btn svg { width: 20px; height: 20px; flex: none; }

/* home */
.hero { display: flex; flex-direction: column; gap: 6px; padding-block: 12px 4px; }
.plates { display: flex; gap: 4px; align-items: center; height: 26px; }
.plates i { display: block; width: 7px; border-radius: 2px; }
.start-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.history { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: start; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.hrow .date { font-family: var(--f-display); font-weight: 700; text-align: center; min-width: 3.2rem; line-height: 1.1; }
.hrow .date b { display: block; font-size: 1.4rem; }
.hrow .names { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* log */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.topbar .grow { flex: 1; min-width: 0; }
.clock { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.ex-head { display: flex; align-items: flex-start; gap: 4px; }
.ex-head .grow { flex: 1; min-width: 0; padding-top: 6px; }
.ex-head .en { color: var(--muted); font-size: .85rem; direction: ltr; text-align: right; }
.prev { font-size: .85rem; color: var(--muted); }
.prev span { display: inline-block; direction: ltr; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.srow { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.srow.head { font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
.srow .n { font-family: var(--f-display); font-weight: 700; color: var(--muted); text-align: center; }
.srow input { width: 100%; box-sizing: border-box; min-height: 48px; font: 600 1.25rem var(--f-display); text-align: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
.srow input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--soft); }
.ex-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; background: var(--soft); border-radius: 10px; padding: 8px; }
.chip { border: 1px solid transparent; background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.add-ex { border: 2px dashed var(--line); background: transparent; color: var(--accent); font-weight: 700; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* timer bar */
#timerbar { position: fixed; inset: auto 0 0 0; z-index: 8; background: var(--ink); color: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
#timerbar .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#timerbar .t { font: 800 2rem var(--f-display); font-variant-numeric: tabular-nums; direction: ltr; min-width: 5.2ch; text-align: center; }
#timerbar .grow { flex: 1; min-width: 0; }
#timerbar .grow div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#timerbar .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
#timerbar.done { background: var(--red); }
#timerbar .track { height: 4px; background: color-mix(in srgb, var(--bg) 25%, transparent); }
#timerbar .track i { display: block; height: 100%; background: var(--bg); width: 0; margin-inline-start: auto; }

/* report */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font: 800 1.5rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat:first-child { border-top: 4px solid var(--accent); }
.stat:nth-child(2) { border-top: 4px solid var(--red); }
.stat:nth-child(3) { border-top: 4px solid #d9a400; }
.stat:nth-child(4) { border-top: 4px solid var(--green); }
.rep-ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.rep-ex .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rep-sets { display: flex; flex-wrap: wrap; gap: 6px; }
.rep-sets span { background: var(--chip); border-radius: 8px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.pill { border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.pill.up { background: var(--green-soft); color: var(--green); }
.pill.down { background: var(--red-soft); color: var(--red); }
.pill.same, .pill.new { background: var(--chip); color: var(--muted); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.row-actions .btn { flex: 1 1 auto; }

/* modal + picker */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 14, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 88%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .sh-head { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.sheet .sh-body { overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; }
.sheet.dialog .sh-body { gap: 14px; padding-top: 16px; }
.sheet input[type="search"] { width: 100%; box-sizing: border-box; min-height: 48px; font: inherit; font-size: 1.05rem; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.pk-cat { font-family: var(--f-display); font-weight: 700; font-size: .85rem; color: var(--muted); padding: 12px 4px 4px; }
.pk-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: start; width: 100%; padding: 11px 10px; min-height: 48px; border: 0; background: transparent; border-radius: 8px; }
.pk-item:hover, .pk-item:focus-visible { background: var(--soft); }
.pk-item .en { color: var(--muted); font-size: .85rem; direction: ltr; }
.pk-item.in-log .he::after { content: " · ביומן"; color: var(--accent); font-size: .8rem; }
.pk-item.custom { color: var(--accent); font-weight: 700; }
textarea.copy { width: 100%; box-sizing: border-box; min-height: 200px; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--ink); }

.acct { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.auth { display: flex; flex-direction: column; gap: 8px; }
.auth label { font-weight: 500; margin-top: 4px; }
.auth input { min-height: 48px; font: inherit; font-size: 1.05rem; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: left; }
.auth .err { color: var(--red); min-height: 1.2em; }
.auth .ok { color: var(--green); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border-radius: 10px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 8px; min-height: 40px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
#toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
#toast button { background: transparent; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 6px; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } h1 { font-size: 1.6rem; } }
@media (prefers-reduced-motion: no-preference) { .ex.fresh { animation: pop .35s ease-out; } @keyframes pop { from { background: var(--soft); } } }
</style>

  out.push(h('div', { class: 'row-actions' },
    h('button', { class: 'btn primary', type: 'button', onclick: copy }, 'העתק דו״ח'),
    h('button', { class: 'btn', type: 'button', onclick: () => go('home') }, 'חזרה לראשי'),
    h('button', { class: 'btn danger', type: 'button', onclick: () => dialog('למחוק את האימון?', [h('p', { style: 'margin:0' }, `האימון מ${dayFmt.format(w.start)} יימחק מהיומן לצמיתות.`)],
      [{ label: 'מחק', cls: 'danger', fn: () => { S.history = S.history.filter(x => x.start !== w.start); save('gym-w-' + w.start, null); closeModal(); go('home'); toast('האימון נמחק'); } }, { label: 'ביטול', fn: closeModal }]) }, 'מחק אימון')));
  return out;
}

initStore();
</script>
